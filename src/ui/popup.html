<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Usage Tracker</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="aut-root">
  <header class="popup-head">
    <span class="aut-widget__brand-dot"></span>
    <h1>AI Usage Tracker</h1>
    <div class="popup-actions">
      <button id="refresh" class="aut-iconbtn" title="Refresh now" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 9 16 9"/></svg>
      </button>
      <button id="settings" class="aut-iconbtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <main id="dashboard" class="popup-dashboard">
    <!-- populated by popup.js -->
  </main>

  <footer class="popup-foot">
    <span id="updated">Never updated</span>
    <span class="version">v0.2.0</span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
