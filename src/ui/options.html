<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="app.settingsTitle"></title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body class="aut-root">
  <header class="opt-head">
    <span class="aut-widget__brand-dot"></span>
    <h1 data-i18n="app.name"></h1>
    <span class="opt-head__sub">v__AUT_VERSION__</span>
  </header>

  <main class="opt-shell">
    <nav class="opt-nav" data-i18n-aria-label="options.sections">
      <a href="#profiles" data-i18n="options.profiles"></a>
      <a href="#sync" data-i18n="options.sync"></a>
      <a href="#providers" data-i18n="options.providers"></a>
      <a href="#api" data-i18n="options.apiAccess"></a>
      <a href="#forecast" data-i18n="options.forecast"></a>
      <a href="#collaboration" data-i18n="options.team"></a>
      <a href="#rows" data-i18n="options.rows"></a>
      <a href="#refresh" data-i18n="options.refresh"></a>
      <a href="#appearance" data-i18n="options.appearance"></a>
      <a href="#notifications" data-i18n="options.alerts"></a>
      <a href="#history" data-i18n="options.history"></a>
      <a href="#widget" data-i18n="options.widget"></a>
      <a href="#status" data-i18n="options.status"></a>
    </nav>

    <div class="opt-main">
    <section id="profiles" class="opt-card">
      <h2 data-i18n="options.localProfiles"></h2>
      <p class="opt-hint" data-i18n="options.localProfilesHint"></p>
      <div id="profileStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingProfiles"></div>
      <div id="profileList" class="profile-list"></div>
      <div class="opt-row opt-row--wrap">
        <label for="newProfileName" data-i18n="options.newProfile"></label>
        <input id="newProfileName" class="opt-text" type="text" maxlength="48" autocomplete="off" data-i18n-placeholder="options.newProfilePlaceholder" data-i18n-aria-label="inline.newProfile">
        <button id="createProfile" class="opt-btn" data-i18n="options.createProfile"></button>
      </div>
    </section>

    <section id="sync" class="opt-card">
      <h2 data-i18n="options.optionalSync"></h2>
      <p class="opt-hint" data-i18n="options.syncHint"></p>
      <label class="opt-toggle"><input id="syncSettings" type="checkbox"><span data-i18n="options.syncToggle"></span></label>
      <div id="syncStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.checkingSync"></div>
      <div class="opt-row opt-row--wrap">
        <button id="clearSyncedSettings" class="opt-btn opt-btn--quiet" type="button" data-i18n="options.clearSynced"></button>
      </div>
    </section>

    <section id="providers" class="opt-card">
      <h2 data-i18n="options.providers"></h2>
      <p class="opt-hint" data-i18n="options.providersHint"></p>
      <div id="provider-toggles" class="opt-grid"></div>
    </section>

    <section id="api" class="opt-card">
      <h2 data-i18n="options.apiTitle"></h2>
      <p class="opt-hint" data-i18n="options.apiHint"></p>
      <div id="apiCredentialsStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingCredentials"></div>
      <div class="opt-row opt-row--wrap">
        <label for="apiCredentialStorageMode" data-i18n="options.credentialStorageMode"></label>
        <select id="apiCredentialStorageMode" class="opt-select aut-field">
          <option value="session" data-i18n="options.credentialStorageSessionOption"></option>
          <option value="persistent" data-i18n="options.credentialStoragePersistentOption"></option>
        </select>
      </div>
      <div id="apiCredentialStorageStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingCredentialStorage"></div>
      <div id="api-credentials" class="api-credential-grid"></div>
      <div class="opt-divider"></div>
      <h3 data-i18n="options.redactedBreakdown"></h3>
      <p class="opt-hint" data-i18n="options.breakdownHint"></p>
      <div id="apiBreakdownStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingBreakdown"></div>
      <div id="apiBreakdown" class="api-breakdown"></div>
      <div class="opt-row opt-row--wrap">
        <button id="exportApiBreakdown" class="opt-btn opt-btn--quiet" data-i18n="options.exportApiCSV"></button>
      </div>
    </section>

    <section id="forecast" class="opt-card">
      <h2 data-i18n="forecast.title"></h2>
      <p class="opt-hint" data-i18n="options.forecastHint"></p>
      <div id="forecastStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingForecast"></div>
      <div id="forecastBreakdown" class="forecast-breakdown"></div>
      <div class="opt-divider"></div>
      <h3 data-i18n="forecast.planGuidance"></h3>
      <p class="opt-hint" data-i18n="options.planHint"></p>
      <div id="optimizationStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingPlan"></div>
      <div id="optimizationBreakdown" class="forecast-breakdown"></div>
    </section>

    <section id="collaboration" class="opt-card">
      <h2 data-i18n="options.teamTitle"></h2>
      <p class="opt-hint" data-i18n="options.teamHint"></p>
      <label class="opt-toggle"><input id="collaborationEnabled" type="checkbox"><span data-i18n="options.enableTeam"></span></label>
      <div class="opt-grid collaboration-config">
        <label><span data-i18n="options.teamLabel"></span>
          <input id="collaborationTeamName" class="opt-text" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="options.teamPlaceholder">
        </label>
        <label><span data-i18n="options.memberLabel"></span>
          <input id="collaborationMemberName" class="opt-text" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="options.memberPlaceholder">
        </label>
      </div>
      <label class="opt-toggle"><input id="collaborationAttributionEnabled" type="checkbox"><span data-i18n="options.attributionToggle"></span></label>
      <div class="opt-grid collaboration-config">
        <label><span data-i18n="options.clientLabel"></span>
          <input id="collaborationClientName" class="opt-text collaboration-attribution-field" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="options.clientPlaceholder">
        </label>
        <label><span data-i18n="options.projectLabel"></span>
          <input id="collaborationProjectName" class="opt-text collaboration-attribution-field" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="options.projectPlaceholder">
        </label>
        <label><span data-i18n="options.branchLabel"></span>
          <input id="collaborationBranchName" class="opt-text collaboration-attribution-field" type="text" maxlength="64" autocomplete="off" data-i18n-placeholder="options.branchPlaceholder">
        </label>
      </div>
      <div id="collaborationStatus" class="opt-callout" role="status" aria-live="polite"></div>
      <div id="collaborationBreakdown" class="collaboration-breakdown"></div>
      <div class="opt-row opt-row--wrap">
        <button id="exportCollaborationContribution" class="opt-btn" data-i18n="options.exportContribution"></button>
        <button id="importCollaboration" class="opt-btn" data-i18n="options.importContribution"></button>
        <button id="exportCollaborationLedger" class="opt-btn opt-btn--quiet" data-i18n="options.exportLedger"></button>
        <button id="exportCollaborationInvoice" class="opt-btn opt-btn--quiet" data-i18n="options.exportInvoice"></button>
        <button id="clearCollaboration" class="opt-btn opt-btn--quiet" data-i18n="options.clearLedger"></button>
        <input id="collaborationImportFile" type="file" accept="application/json,.json" data-i18n-aria-label="options.selectCollaboration" hidden>
      </div>
      <p class="opt-hint" data-i18n="options.teamShareHint"></p>
    </section>

    <section id="rows" class="opt-card">
      <h2 data-i18n="options.quotaRows"></h2>
      <p class="opt-hint" data-i18n="options.rowsHint"></p>
      <div id="row-toggles" class="opt-grid"></div>
    </section>

    <section id="refresh" class="opt-card">
      <h2 data-i18n="options.refresh"></h2>
      <p class="opt-hint" data-i18n="options.refreshHint"></p>
      <div class="opt-row">
        <label for="refreshMinutes" data-i18n="options.refreshInterval"></label>
        <select id="refreshMinutes" class="opt-select aut-field">
          <option value="1" data-i18n="options.everyMinute" data-i18n-count="1"></option>
          <option value="5" data-i18n="options.everyMinute" data-i18n-count="5"></option>
          <option value="15" data-i18n="options.everyMinute" data-i18n-count="15"></option>
          <option value="30" data-i18n="options.everyMinute" data-i18n-count="30"></option>
        </select>
      </div>
      <div class="opt-row">
        <label class="opt-toggle"><input id="silentTabRefresh" type="checkbox"><span data-i18n="options.hiddenFallback"></span></label>
      </div>
      <div class="opt-divider"></div>
      <h3 data-i18n="options.schedulerTitle"></h3>
      <p class="opt-hint" data-i18n="options.schedulerHint"></p>
      <label class="opt-toggle"><input id="nativeSchedulerEnabled" type="checkbox"><span data-i18n="options.schedulerToggle"></span></label>
      <div id="nativeSchedulerStatus" class="opt-callout" role="status" aria-live="polite"></div>
    </section>

    <section id="appearance" class="opt-card">
      <h2 data-i18n="options.appearance"></h2>
      <p class="opt-hint" data-i18n="options.appearanceHint"></p>
      <div class="opt-row">
        <label for="theme" data-i18n="options.theme"></label>
        <select id="theme" class="opt-select aut-field">
          <option value="mocha" data-i18n="options.mocha"></option>
          <option value="latte" data-i18n="options.latte"></option>
          <option value="system" data-i18n="options.system"></option>
        </select>
      </div>
      <div class="opt-row">
        <label for="locale" data-i18n="options.language"></label>
        <select id="locale" class="opt-select aut-field">
          <option value="en" data-i18n="language.en"></option>
          <option value="es" data-i18n="language.es"></option>
          <option value="fr" data-i18n="language.fr"></option>
          <option value="de" data-i18n="language.de"></option>
          <option value="ar" data-i18n="language.ar"></option>
        </select>
      </div>
      <p class="opt-hint" data-i18n="options.languageHint"></p>
      <div class="opt-row">
        <label class="opt-toggle"><input id="highContrast" type="checkbox"><span data-i18n="options.highContrast"></span></label>
      </div>
      <div class="opt-thresholds">
        <label class="opt-range">
          <span><span data-i18n="options.warnAt"></span> <strong id="warnAtValue">50%</strong></span>
          <input id="warnAt" type="range" min="25" max="85" step="5">
        </label>
        <label class="opt-range">
          <span><span data-i18n="options.dangerAt"></span> <strong id="dangerAtValue">80%</strong></span>
          <input id="dangerAt" type="range" min="55" max="95" step="5">
        </label>
      </div>
    </section>

    <section id="notifications" class="opt-card">
      <h2 data-i18n="options.notifications"></h2>
      <p class="opt-hint" data-i18n="options.notificationsHint"></p>
      <div id="notificationPermissionStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.checkingPermission"></div>
      <div class="opt-row opt-row--wrap">
        <button id="testNotification" class="opt-btn" data-i18n="options.testNotification"></button>
      </div>
      <div id="snoozeStatus" class="opt-callout"></div>
      <div class="opt-row opt-row--wrap">
        <button id="snoozeNotifications" class="opt-btn" data-i18n="options.snoozeOneHour"></button>
        <button id="clearSnooze" class="opt-btn opt-btn--quiet" data-i18n="options.resumeNotifications"></button>
      </div>
      <div class="opt-grid">
        <label class="opt-toggle"><input type="checkbox" data-notif="R1-60"><span data-i18n="options.renewal60"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="R1-15"><span data-i18n="options.renewal15"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="R1-0"><span data-i18n="options.renewal0"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="R2"><span data-i18n="options.resetPositive"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="U1-75"><span data-i18n="options.threshold75"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="U1-90"><span data-i18n="options.threshold90"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="U1-95"><span data-i18n="options.threshold95"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="U2"><span data-i18n="options.burnRate"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="U3"><span data-i18n="options.spike"></span></label>
        <label class="opt-toggle"><input type="checkbox" data-notif="D1"><span data-i18n="options.dailyBriefing"></span></label>
      </div>
      <div class="opt-row">
        <label for="anomalyThresholdPercent" data-i18n="options.spikeThreshold"></label>
        <select id="anomalyThresholdPercent" class="opt-select aut-field">
          <option value="10" data-i18n="options.percentagePoints" data-i18n-count="10"></option>
          <option value="15" data-i18n="options.percentagePoints" data-i18n-count="15"></option>
          <option value="20" data-i18n="options.percentagePoints" data-i18n-count="20"></option>
          <option value="25" data-i18n="options.percentagePoints" data-i18n-count="25"></option>
          <option value="30" data-i18n="options.percentagePoints" data-i18n-count="30"></option>
          <option value="40" data-i18n="options.percentagePoints" data-i18n-count="40"></option>
          <option value="50" data-i18n="options.percentagePoints" data-i18n-count="50"></option>
        </select>
      </div>
      <p class="opt-hint" data-i18n="options.spikeHint"></p>
      <div class="opt-row">
        <label for="dailyBriefingHour" data-i18n="options.dailyBriefingTime"></label>
        <select id="dailyBriefingHour" class="opt-select aut-field"></select>
      </div>
      <div class="opt-divider"></div>
      <h3 data-i18n="options.webhookTitle"></h3>
      <p class="opt-hint" data-i18n="options.webhookHint"></p>
      <label class="opt-toggle"><input id="webhookEnabled" type="checkbox"><span data-i18n="options.webhookToggle"></span></label>
      <div class="opt-row opt-row--wrap">
        <label for="webhookURL" data-i18n="options.webhookURL"></label>
        <input id="webhookURL" class="opt-input opt-input--wide" type="url" maxlength="2048" autocomplete="off" data-i18n-placeholder="options.webhookPlaceholder">
      </div>
      <label class="opt-toggle"><input id="webhookIncludeDetails" type="checkbox"><span data-i18n="options.webhookInclude"></span></label>
      <div class="opt-row opt-row--wrap">
        <button id="testWebhook" class="opt-btn opt-btn--quiet" data-i18n="options.testWebhook"></button>
      </div>
      <div id="webhookStatus" class="opt-callout" role="status" aria-live="polite"></div>
      <div class="opt-divider"></div>
      <h3 data-i18n="options.apiCapsTitle"></h3>
      <p class="opt-hint" data-i18n="options.apiCapsHint"></p>
      <div class="opt-row opt-row--wrap">
        <label for="sessionBudgetCap" data-i18n="options.sessionCap"></label>
        <input id="sessionBudgetCap" class="opt-input opt-input--number" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" data-i18n-placeholder="options.off">
      </div>
      <div class="opt-row opt-row--wrap">
        <label for="dailyBudgetCap" data-i18n="options.dailyCap"></label>
        <input id="dailyBudgetCap" class="opt-input opt-input--number" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" data-i18n-placeholder="options.off">
      </div>
      <div class="opt-row opt-row--wrap">
        <button id="resetBudgetSession" class="opt-btn opt-btn--quiet" data-i18n="options.resetBudget"></button>
      </div>
      <div id="budgetStatus" class="opt-callout" role="status" aria-live="polite"></div>
    </section>

    <section id="history" class="opt-card">
      <h2 data-i18n="options.history"></h2>
      <p class="opt-hint" data-i18n="options.historyHint"></p>
      <div id="historyStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.loadingHistory"></div>
      <div class="opt-row">
        <label for="historyRetentionDays" data-i18n="options.keepSamples"></label>
        <select id="historyRetentionDays" class="opt-select aut-field">
          <option value="7" data-i18n="options.days" data-i18n-count="7"></option>
          <option value="14" data-i18n="options.days" data-i18n-count="14"></option>
          <option value="30" data-i18n="options.days" data-i18n-count="30"></option>
          <option value="60" data-i18n="options.days" data-i18n-count="60"></option>
          <option value="90" data-i18n="options.days" data-i18n-count="90"></option>
        </select>
      </div>
      <div class="opt-row opt-row--wrap">
        <button id="exportHistory" class="opt-btn" data-i18n="options.exportCSV"></button>
        <button id="compactHistory" class="opt-btn" data-i18n="options.compactHistory"></button>
        <button id="clearHistory" class="opt-btn opt-btn--quiet" data-i18n="options.clearHistory"></button>
      </div>
      <label class="opt-toggle"><input id="includeHistoryInSettings" type="checkbox"><span data-i18n="options.includeHistory"></span></label>
      <div class="opt-row opt-row--wrap">
        <button id="exportSettings" class="opt-btn" data-i18n="options.exportSettings"></button>
        <button id="importSettings" class="opt-btn" data-i18n="options.importSettings"></button>
        <input id="settingsImportFile" type="file" accept="application/json,.json" data-i18n-aria-label="options.selectSettings" hidden>
      </div>
      <div id="settingsTransferStatus" class="opt-callout" role="status" aria-live="polite" data-i18n="options.settingsBackupHint"></div>
    </section>

    <section id="widget" class="opt-card">
      <h2 data-i18n="options.widget"></h2>
      <p class="opt-hint" data-i18n="options.widgetHint"></p>
      <div class="opt-row">
        <button id="resetWidgetPosition" class="opt-btn" data-i18n="options.resetWidget"></button>
      </div>
    </section>

    <section id="status" class="opt-card">
      <h2 data-i18n="options.status"></h2>
      <p class="opt-hint" data-i18n="options.statusHint"></p>
      <div id="diagnostics" class="opt-diagnostics"></div>
      <div class="opt-row opt-row--wrap">
        <button id="refreshDiagnostics" class="opt-btn" data-i18n="app.refreshNow"></button>
        <button id="copyDiagnostics" class="opt-btn" data-i18n="options.copyDiagnostics"></button>
        <button id="exportDiagnostics" class="opt-btn" data-i18n="options.exportDiagnostics"></button>
        <button id="exportMcpState" class="opt-btn" data-i18n="options.exportMcp"></button>
        <button id="resetClaudeOrg" class="opt-btn opt-btn--quiet" data-i18n-title="options.resetClaudeOrgTitle" data-i18n="options.resetClaudeOrg"></button>
      </div>
    </section>
    </div>
  </main>

  <footer class="opt-foot">
    <span id="saveStatus" role="status" aria-live="polite" data-i18n="app.saved"></span>
    <span class="opt-foot__right">
      <a href="https://github.com/SysAdminDoc/AI-Usage_Tracker" target="_blank" data-i18n="options.github"></a>
    </span>
  </footer>

  <script src="options.js" type="module"></script>
</body>
</html>
