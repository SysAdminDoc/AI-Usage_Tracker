name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (no v prefix, e.g. 0.1.3)"
        required: true
        default: "0.1.3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Regenerate icons
        run: node build/generate-icons.mjs

      - name: Build all targets
        run: node build/build-all.mjs

      - name: List artifacts
        run: ls -la dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets with --clobber."
          else
            gh release create "$TAG" \
              --title "AI Usage Tracker $TAG" \
              --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" \
            "dist/AI-Usage-Tracker-chrome-v${{ inputs.version }}.zip" \
            "dist/ai-usage-tracker-firefox-v${{ inputs.version }}.xpi" \
            "dist/userscript/ai-usage-tracker.user.js" \
            --clobber
